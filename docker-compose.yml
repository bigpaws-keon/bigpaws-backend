services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bigpaws
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 외부 노출 안 함 — 백엔드만 내부 네트워크로 접근

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"   # 내부 네트워크에만 노출, 외부 공개는 Caddy가 담당
    depends_on:
      - db

  # HTTPS 리버스 프록시 — Let's Encrypt 인증서 자동 발급/갱신
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
